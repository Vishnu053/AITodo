name: CI
on:
  push:
  pull_request:
jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Core
  app-ios:
    name: Core tests + iOS app build (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Core
      - run: brew install xcodegen && xcodegen
      - name: Build for iOS Simulator
        run: xcodebuild -project AIToDo.xcodeproj -scheme AIToDo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
